<html lang="ar" dir="rtl"><style>* { -webkit-text-size-adjust: 86.33333333333333% !important; }</style><head><style>

</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AYKA Dashboard</title>
<style>
*{box-sizing:border-box}body{background:#0a0a0b;color:#fff;font-family:sans-serif;margin:0}
.top{background:#111113;border-bottom:1px solid #222;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.logo{font-weight:900;font-size:22px;letter-spacing:3px;position:relative;display:inline-block}
.logo .dot{color:#3B82F6;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.logo::before,.logo::after{content:"AYKA";position:absolute;left:0;top:0;opacity:.0}
.glitch{animation:glitch 3s infinite}
@keyframes glitch{0%,92%,100%{text-shadow:none}93%{text-shadow:2px 0 #3B82F6,-2px 0 #ff004c}95%{text-shadow:-2px 0 #3B82F6,2px 0 #ff004c}97%{text-shadow:none}}
.menu{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap;background:#0a0a0b;border-bottom:1px solid #222;position:sticky;top:58px;z-index:19}
.menu button{background:#111113;color:#ccc;border:1px solid #222;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:bold}
.menu button.active{background:#3B82F6;color:#fff;border-color:#3B82F6}
.wrap{padding:16px;max-width:1000px;margin:0 auto;padding-bottom:110px}
.card{background:#111113;border:1px solid #222;border-radius:16px;padding:14px;margin:12px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}
input,select,textarea{background:#0a0a0b;border:1px solid #222;color:#fff;border-radius:10px;padding:10px;width:100%}
input.num{width:72px;text-align:center;padding:8px}
label{font-size:11px;color:#888;letter-spacing:1px;display:block;margin-bottom:4px}
.btn{background:#22c55e;color:#000;border:none;padding:12px 18px;border-radius:12px;font-weight:bold;cursor:pointer}
.btnB{background:#3B82F6;color:#fff;border:none;padding:10px 14px;border-radius:12px;font-weight:bold;cursor:pointer}
.btnD{background:#ef4444;color:#fff;border:none;padding:10px 14px;border-radius:12px;font-weight:bold;cursor:pointer}
.btnG{background:#222;color:#fff;border:1px solid #333;padding:10px 14px;border-radius:12px;cursor:pointer}
.small{font-size:12px;color:#888}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a1a}
.badge{font-size:11px;background:#222;padding:4px 10px;border-radius:20px}
.badgeP{background:#f59e0b;color:#000}.badgeC{background:#22c55e;color:#000}
.chip{display:inline-block;padding:8px 12px;border:1px solid #333;border-radius:20px;margin:3px;cursor:pointer;font-size:13px;background:#0a0a0b}.chip.on{background:#3B82F6;border-color:#3B82F6;color:#fff}.chipBox{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.savebar{position:fixed;bottom:0;left:0;right:0;background:#111113;border-top:1px solid #222;padding:12px 16px;display:flex;gap:8px;justify-content:space-between;align-items:center;z-index:99}
.login{max-width:420px;margin:70px auto;text-align:center;padding:20px}.hidden{display:none}
.prod{display:flex;gap:12px}.prod img{width:90px;height:90px;object-fit:cover;border-radius:12px;background:#000;border:1px solid #222}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #222;text-align:right;font-size:13px}
</style></head><body>
<div id="login" class="login"><div class="logo glitch">AYKA<span class="dot">.</span></div><p class="small">لوحة تحكم المتجر - منفصلة تماما عن المتجر</p><input id="pw" type="password" placeholder="الباسورد"><br><br><button class="btn" onclick="doLogin()">فتح</button><p class="small" id="loginErr"></p></div>
<div id="app" class="hidden">
<div class="top"><div><span class="logo glitch">AYKA<span class="dot">.</span></span> <span style="font-size:11px;color:#888">DASHBOARD • Firebase فقط</span></div><div><span id="conn" style="font-size:12px;color:#22c55e">● متصل</span> <button class="btnG" onclick="location.reload()">ريفريش</button></div></div>
<div class="menu">
<button data-t="products" class="active" onclick="showTab('products')">Products</button>
<button data-t="inventory" onclick="showTab('inventory')">Inventory</button>
<button data-t="orders" onclick="showTab('orders')">Orders</button>
<button data-t="shipping" onclick="showTab('shipping')">Shipping</button>
<button data-t="categories" onclick="showTab('categories')">Categories</button>
<button data-t="settings" onclick="showTab('settings')">Settings</button>
</div>
<div class="wrap">
<div id="status" class="small">✅ جاهز - مفيش حفظ تلقائي</div>
<div id="tab-products"></div>
<div id="tab-inventory" class="hidden"></div>
<div id="tab-orders" class="hidden"></div>
<div id="tab-shipping" class="hidden"></div>
<div id="tab-categories" class="hidden"></div>
<div id="tab-settings" class="hidden"></div>
</div>
<div class="savebar"><div><span id="saveStatus" style="font-size:12px;color:#888">✅ كل التغييرات محفوظة</span><div style="font-size:10px;color:#666">V11 - صور رئيسية + جاليري + الوان/مقاسات + شحن ثابت - Firebase فقط - مفيش GAS - الخصم مرة واحدة بس من Firebase</div></div><button class="btn" onclick="saveAll()">✅ حفظ التغييرات</button></div>
</div>
<script>
var FB='https://ayka-store-9a2d5-default-rtdb.firebaseio.com';
var PASS='Ayka@2027Kareem';
var products=[], orders=[], shipping={}, settings={storeName:'AYKA',email:'Kareemmudii@gmail.com'}, categories=[];
var dirty=false, deductedIds=[], pollTimer=null;
var GOVS=['Cairo','Giza','Alexandria','Dakahlia','Sharqia','Gharbia','Monufia','Qalyubia','Kafr El Sheikh','Damietta','Port Said','Ismailia','Suez','Fayoum','Beni Suef','Minya','Asyut','Sohag','Qena','Luxor','Aswan','Red Sea','Beheira','Matrouh','North Sinai','South Sinai','New Valley'];
var DEF_SHIP={Cairo:50,Giza:50,Alexandria:70};
function shipDefault(g){ if(DEF_SHIP[g]) return DEF_SHIP[g]; return 90; }
function doLogin(){ if(document.getElementById('pw').value===PASS){ document.getElementById('login').style.display='none'; document.getElementById('app').classList.remove('hidden'); init(); } else document.getElementById('loginErr').textContent='باسورد غلط'; }
function showTab(t){ ['products','inventory','orders','shipping','categories','settings'].forEach(function(x){ document.getElementById('tab-'+x).classList.toggle('hidden', x!==t); }); document.querySelectorAll('.menu button').forEach(function(b){ b.classList.toggle('active', b.dataset.t===t); }); }
function markDirty(){ dirty=true; var s=document.getElementById('saveStatus'); s.textContent='● فيه تغييرات مش محفوظة - دوس حفظ التغييرات'; s.style.color='#facc15'; }
function syncShippingToStorage(){ try{ localStorage.setItem('ayka_v2_shipping', JSON.stringify(shipping)); }catch(e){} }
async function init(){
  // 1) اقرا deductedIds من Firebase الاول - ده اللي بيمنع الخصم مرتين حتى في تاب خفي
  try{ var rd=await fetch(FB+'/deductedIds.json?ts='+Date.now()); var dd=await rd.json(); if(Array.isArray(dd)) deductedIds=dd; else if(dd) deductedIds=Object.values(dd); }catch(e){}
  try{ var rl=JSON.parse(localStorage.getItem('ayka_deducted_ids')||'[]'); rl.forEach(function(id){ if(deductedIds.indexOf(id)===-1) deductedIds.push(id); }); }catch(e){}
  await loadAll();
  // Poll كل 3 ثواني للاوردرات بس - ولو بتعدل، ميكتبش فوق تعديلك
  pollTimer=setInterval(pollOrders, 3000);
}
async function loadAll(){
  var r=await fetch(FB+'/products.json?ts='+Date.now()); products=await r.json(); if(!Array.isArray(products)) products=Object.values(products||[]);
  var r2=await fetch(FB+'/shipping.json?ts='+Date.now()); var _sh2=null; try{ var _r2b=await fetch(FB+'/settings/shipping.json?ts='+Date.now()); _sh2=await _r2b.json(); }catch(e){}
  try{ await fetch(FB+'/settings/shipping.json',{method:'PUT',body:JSON.stringify(shipping)}); await fetch(FB+'/shippingRates.json',{method:'PUT',body:JSON.stringify(shipping)}); }catch(e){} var sh=await r2.json(); if(sh) shipping=sh; else shipping={}; if(_sh2 && typeof _sh2==='object'){ Object.keys(_sh2).forEach(function(k){ if(shipping[k]==null) shipping[k]=_sh2[k]; }); } GOVS.forEach(function(g){ if(shipping[g]==null) shipping[g]=shipDefault(g); });
  syncShippingToStorage();
  var r3=await fetch(FB+'/orders.json?ts='+Date.now()); orders=await r3.json(); if(!Array.isArray(orders)) orders=Object.values(orders||[]);
  var r4=await fetch(FB+'/settings.json?ts='+Date.now()); var st=await r4.json(); if(st) settings=Object.assign(settings, st);
  categories=[]; products.forEach(function(p){ if(p.category && categories.indexOf(p.category)===-1) categories.push(p.category); });
  renderAll();
  setTimeout(function(){ products.forEach(function(_,pi){ try{renderChips(pi);}catch(e){} }); },300);
}
async function pollOrders(){
  if(dirty) return; // حماية: لو بتعدل، ميكتبش فوق تعديلك قبل ما تدوس حفظ
  try{
    var r=await fetch(FB+'/orders.json?ts='+Date.now()); var fresh=await r.json(); if(!Array.isArray(fresh)) fresh=Object.values(fresh||[]);
    var newOrders=fresh.filter(function(o){ return o && o.id && !orders.find(function(x){return String(x.id)===String(o.id);}); });
    if(newOrders.length){ orders=fresh; renderOrders(); newOrders.forEach(function(o){ tryDeduct(o); }); }
    else if(JSON.stringify(fresh)!==JSON.stringify(orders)){ orders=fresh; renderOrders(); }
  }catch(e){}
}
async function tryDeduct(order){
  if(!order || !order.id) return;
  if(order.status==='Cancelled' || order.status==='Canceled' || order.status==='ملغي') return;
  if(deductedIds.indexOf(String(order.id))!==-1) return; // متخصمش مرتين - متسجل في Firebase
  var items=order.items||order.products||order.cart||[]; if(!items.length && order.order && order.order.items) items=order.order.items; if(!items.length) { await markDeducted(order.id); return; }
  // GET جديد قبل الخصم - عشان متخصمش من قديم
  var r=await fetch(FB+'/products.json?ts='+Date.now()); var fresh=await r.json(); if(!Array.isArray(fresh)) fresh=Object.values(fresh||[]);
  var changed=false;
  items.forEach(function(item){
    var pid=item.productId||item.id||item.product_id; var qty=Number(item.qty||item.quantity||1); var size=item.size||item.variantSize||''; var color=item.color||item.variantColor||'';
    var prod=fresh.find(function(p){return String(p.id)===String(pid)||p.name===item.name;}); if(!prod) return;
    if(prod.variants && Array.isArray(prod.variants)){
      var v=prod.variants.find(function(x){return String(x.size)===String(size) && String(x.color)===String(color);});
      if(!v) v=prod.variants.find(function(x){return String(x.size)===String(size);});
      if(v){ v.stock=Math.max(0,(Number(v.stock)||0)-qty); changed=true; }
      prod.stock=prod.variants.reduce(function(s,x){return s+(Number(x.stock)||0);},0);
    } else { prod.stock=Math.max(0,(Number(prod.stock)||0)-qty); changed=true; }
  });
  await markDeducted(order.id); // سجل الاول عشان لو حصل ريفريش ميخصمش تاني
  if(changed){ await fetch(FB+'/products.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(fresh)}); if(!dirty){ products=fresh; renderAll(); } }
}
async function markDeducted(id){
  if(deductedIds.indexOf(String(id))===-1) deductedIds.push(String(id));
  try{ localStorage.setItem('ayka_deducted_ids', JSON.stringify(deductedIds)); }catch(e){}
  try{ await fetch(FB+'/deductedIds.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(deductedIds)}); }catch(e){}
}
function renderAll(){ renderProducts(); renderInventory(); renderOrders(); renderShipping(); renderCategories(); renderSettings(); }
function imgOf(p){ return (p.images&&p.images[0])||p.image||'https://via.placeholder.com/90'; }
function renderProducts(){
  var h='<h3>Products</h3><button class="btnB" onclick="addProduct()">+ اضافة منتج</button>';
  products.forEach(function(p,pi){
    h+='<div class="card"><div class="prod"><img src="'+imgOf(p)+'"><div style="flex:1"><div class="row"><b>'+(p.name||'')+'</b><span class="badge">'+(p.category||'')+'</span></div><div class="small">السعر: '+(p.price||0)+' - الخصم: '+(p.discountPrice||'-')+' - المخزون: '+(p.stock||0)+'</div><div class="small">'+(p.description||'').slice(0,120)+'</div><div style="display:flex;gap:8px;margin-top:8px"><button class="btnB" onclick="editProduct('+pi+')">Edit</button><button class="btnD" onclick="delProduct('+pi+')">Delete</button></div></div></div><div id="edit-'+pi+'" class="hidden" style="margin-top:12px"></div></div>';
  });
  document.getElementById('tab-products').innerHTML=h;
}
function editProduct(pi){
  var p=products[pi]; var el=document.getElementById('edit-'+pi); el.classList.toggle('hidden');
  if(el.classList.contains('hidden')) return;
  el.innerHTML='<div class="grid2"><div><label>الاسم</label><input id="e-name-'+pi+'" value="'+(p.name||'')+'"></div><div><label>السعر</label><input id="e-price-'+pi+'" type="number" value="'+(p.price||0)+'"></div><div><label>سعر الخصم Discount Price</label><input id="e-disc-'+pi+'" type="number" value="'+(p.discountPrice||'')+'"></div><div><label>القسم - اختار من القايمة</label><select id="e-cat-'+pi+'" onchange="catChanged('+pi+',this.value)"><option value="CLOTHING">CLOTHING - ملابس</option><option value="SHOES">SHOES - شوزات</option><option value="BAGS">BAGS - شنط</option><option value="ACCESSORIES">ACCESSORIES - اكسسوارات</option><option value="ENTERTAINMENT">ENTERTAINMENT - ترفيه</option><option value="__custom">+ قسم جديد...</option></select><input id="e-cat-custom-'+pi+'" placeholder="اكتب قسم جديد" style="display:none;margin-top:6px"><div class="small">القسم الحالي: '+(p.category||'')+' - لو اخترت قسم من القايمة هيتطبق، لو كتبت قسم جديد هيتضاف</div></div></div><label>الوصف</label><textarea id="e-desc-'+pi+'" rows="3">'+(p.description||'')+'</textarea><label>المقاسات - دوس عشان تختار</label><div class="chipBox" id="sizes-box-'+pi+'"></div><button type="button" class="btnG" onclick="addSizePrompt('+pi+')">+ مقاس جديد</button><label style="margin-top:8px">المقاسات (بفاصلة)</label><input id="e-sizes-'+pi+'" value="'+((p.variants||[]).map(function(v){return v.size;}).filter(function(v,i,a){return a.indexOf(v)===i;}).join(','))+'"><label>الالوان - دوس عشان تختار، مش لازم تكتب</label><div class="chipBox" id="colors-box-'+pi+'"></div><button type="button" class="btnG" onclick="addColorPrompt('+pi+')">+ لون جديد</button><label style="margin-top:8px">الالوان (بفاصلة) - بتتملي لوحدها من الاختيارات</label><input id="e-colors-'+pi+'" value="'+((p.variants||[]).map(function(v){return v.color;}).filter(function(v,i,a){return a.indexOf(v)===i;}).join(','))+'"><label>الصورة الرئيسية - اللي هتظهر في واجهة المتجر</label><div style="border:2px dashed #22c55e;border-radius:12px;padding:14px;text-align:center;margin:6px 0"><div style="font-size:24px">🖼️</div><div style="font-weight:bold">ارفع الصورة الرئيسية من معرض الجهاز</div><input type="file" accept="image/*" onchange="uploadImg(event,'+pi+')" style="border:none;margin-top:6px"></div><input id="e-img-'+pi+'" placeholder="لو عندك لينك صورة حطه هنا (اختياري)" value="'+(p.image||p.img||'')+'" style="display:none"><div class="small">ارفع من معرض جهازك، الصورة هتتحط كصورة رئيسية على طول</div><label style="margin-top:10px">باقي الصور - الجاليري (ممكن اكتر من 10 صور)</label><div style="border:2px dashed #3B82F6;border-radius:12px;padding:16px;text-align:center;margin:6px 0"><div style="font-size:28px">📸</div><div style="font-weight:bold;margin:6px 0">ارفع من معرض الجهاز</div><input type="file" accept="image/*" multiple onchange="uploadGallery(event,'+pi+')" style="border:none"><div class="small">دوس واختار اكتر من صورة من معرض جهازك في نفس الوقت - مش لازم لينك</div></div><div id="gallery-preview-'+pi+'" style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0"></div><textarea id="e-gallery-'+pi+'" rows="2" style="display:none"> '+((p.gallery||p.images||[]).join('\n'))+'</textarea><div class="small">الصور اللي هترفعها هتظهر هنا، وهي اللي هتظهر جوه صفحة المنتج في المتجر</div><label style="margin-top:10px">المخزون لكل لون + مقاس - ده اللي بيخلي المتجر يخليك تختار اللون والمقاس</label><div id="variants-box-'+pi+'"></div><button type="button" class="btnG" onclick="buildVariants('+pi+')">🔄 حدّث جدول المقاسات / الألوان</button><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" onclick="saveEdit('+pi+')">حفظ المنتج ده</button><button class="btnG" onclick="document.getElementById(\'edit-'+pi+'\').classList.add(\'hidden\')">الغاء</button></div>';
}
function uploadImg(e,pi){ var f=e.target.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ if(!products[pi].images) products[pi].images=[]; products[pi].images[0]=r.result; markDirty(); renderProducts(); }; r.readAsDataURL(f); }
function saveEdit(pi){
  var p=products[pi]; p.name=document.getElementById('e-name-'+pi).value; p.price=Number(document.getElementById('e-price-'+pi).value)||0; p.discountPrice=document.getElementById('e-disc-'+pi).value===''?'':Number(document.getElementById('e-disc-'+pi).value); p.category=document.getElementById('e-cat-'+pi).value; p.description=document.getElementById('e-desc-'+pi).value;
  var sizes=document.getElementById('e-sizes-'+pi).value.split(',').map(function(s){return s.trim();}).filter(Boolean); var colors=document.getElementById('e-colors-'+pi).value.split(',').map(function(s){return s.trim();}).filter(Boolean);
  var nv=[]; sizes.forEach(function(sz){ colors.forEach(function(cl){ var old=(p.variants||[]).find(function(v){return v.size===sz&&v.color===cl;}); nv.push({size:sz,color:cl,stock:old?old.stock:0}); }); }); if(nv.length) p.variants=nv; p.stock=p.variants.reduce(function(s,x){return s+(Number(x.stock)||0);},0); markDirty(); renderAll(); showTab('products');
}
function addProduct(){ products.push({id:Date.now(),name:'منتج جديد',price:0,discountPrice:'',description:'',category:categories[0]||'',stock:0,images:[],variants:[{size:'S',color:'Black',stock:0},{size:'M',color:'Black',stock:0},{size:'L',color:'Black',stock:0}]}); markDirty(); renderAll(); showTab('products'); }
function delProduct(pi){ if(!confirm('تحذف المنتج ده؟')) return; products.splice(pi,1); markDirty(); renderAll(); }
function renderInventory(){
  var h='<h3>Inventory - المخزون لكل Variant</h3><p class="small">غير مخزون Black / S من 1 لـ 5 مثلا، والاجمالي = مجموع الـ Variants</p>';
  products.forEach(function(p,pi){
    h+='<div class="card"><p style="font-weight:bold;margin:0 0 10px">'+(p.emoji||'👕')+' '+p.name+' - Total '+(p.stock||0)+'</p><div class="grid4">';
    (p.variants||[]).forEach(function(v,vi){ h+='<div style="background:#0a0a0b;border:1px solid #222;border-radius:12px;padding:8px"><div style="display:flex;justify-content:space-between"><b style="font-size:12px">'+v.size+'</b><span style="font-size:11px;color:#888">'+v.color+'</span></div><input class="num" data-pi="'+pi+'" data-vi="'+vi+'" type="number" value="'+(v.stock||0)+'" style="width:100%;margin-top:6px"></div>'; });
    h+='</div></div>';
  });
  document.getElementById('tab-inventory').innerHTML=h;
  document.querySelectorAll('#tab-inventory input').forEach(function(inp){ inp.onchange=function(){ var pi=Number(inp.dataset.pi), vi=Number(inp.dataset.vi); products[pi].variants[vi].stock=Number(inp.value)||0; products[pi].stock=products[pi].variants.reduce(function(s,x){return s+(Number(x.stock)||0);},0); markDirty(); renderInventory(); }; });
}
function renderOrders(){
  var h='<h3>Orders ('+orders.length+')</h3><p class="small">الاوردر بيظهر في 3 ثواني من المتجر - الخصم بيتم مرة واحدة بس</p>';
  if(!orders.length) h+='<div class="card">مفيش طلبات</div>';
  orders.slice().reverse().forEach(function(o){
    var items=(o.items||o.products||o.cart||[]); if(!items.length && o.order && o.order.items) items=o.order.items;
    var itemsHtml=items.map(function(i){return '<div class="small">'+(i.name||'')+' - '+(i.size||'')+' '+(i.color||'')+' × '+(i.qty||i.quantity||1)+'</div>';}).join('');

async function confirmOrder(id){

async function deleteOrder(id){

var PRESET_COLORS=['Black','White','Blue','Green','Grey','Beige','Brown','Red','Pink','Yellow','Orange','Purple'];
var PRESET_SIZES=['XS','S','M','L','XL','XXL','One Size'];
function catChanged(pi,val){ var el=document.getElementById('e-cat-custom-'+pi); if(el) el.style.display = (val==='__custom'?'block':'none'); }
function getColors(pi){ var v=document.getElementById('e-colors-'+pi).value||''; return v.split(',').map(function(s){return s.trim()}).filter(Boolean); }
function getSizes(pi){ var v=document.getElementById('e-sizes-'+pi).value||''; return v.split(',').map(function(s){return s.trim()}).filter(Boolean); }
function renderChips(pi){
  var cb=document.getElementById('colors-box-'+pi); if(cb){ var cur=getColors(pi); cb.innerHTML=''; PRESET_COLORS.forEach(function(c){ var on=cur.some(function(x){return x.toLowerCase()===c.toLowerCase()}); var d=document.createElement('span'); d.className='chip'+(on?' on':''); d.textContent=c; d.onclick=function(){ toggleChip(pi,'colors',c); }; cb.appendChild(d); }); }
  var sb=document.getElementById('sizes-box-'+pi); if(sb){ var cur2=getSizes(pi); sb.innerHTML=''; PRESET_SIZES.forEach(function(s){ var on=cur2.some(function(x){return x.toLowerCase()===s.toLowerCase()}); var d=document.createElement('span'); d.className='chip'+(on?' on':''); d.textContent=s; d.onclick=function(){ toggleChip(pi,'sizes',s); }; sb.appendChild(d); }); }
  buildVariants(pi);
}
function toggleChip(pi,kind,val){ var id=kind==='colors'?'e-colors-'+pi:'e-sizes-'+pi; var el=document.getElementById(id); var arr=el.value.split(',').map(function(s){return s.trim()}).filter(Boolean); var idx=arr.findIndex(function(x){return x.toLowerCase()===val.toLowerCase()}); if(idx>=0) arr.splice(idx,1); else arr.push(val); el.value=arr.join(','); renderChips(pi); markDirty(); }
function addColorPrompt(pi){ var c=prompt('اكتب لون جديد:'); if(c){ var el=document.getElementById('e-colors-'+pi); var a=el.value.split(',').map(function(s){return s.trim()}).filter(Boolean); a.push(c.trim()); el.value=a.join(','); if(PRESET_COLORS.indexOf(c.trim())===-1) PRESET_COLORS.push(c.trim()); renderChips(pi); } }
function addSizePrompt(pi){ var s=prompt('اكتب مقاس جديد:'); if(s){ var el=document.getElementById('e-sizes-'+pi); var a=el.value.split(',').map(function(s2){return s2.trim()}).filter(Boolean); a.push(s.trim()); el.value=a.join(','); renderChips(pi); } }
function buildVariants(pi){
  var box=document.getElementById('variants-box-'+pi); if(!box) return;
  var colors=getColors(pi); var sizes=getSizes(pi); if(!colors.length) colors=['Black']; if(!sizes.length) sizes=['One Size'];
  var p=products[pi]||{}; var old={}; (p.variants||[]).forEach(function(v){ old[(v.color+'|'+v.size).toLowerCase()] = v.stock||0; });
  var h='<table><tr><th>اللون</th><th>المقاس</th><th>المخزون</th></tr>';
  colors.forEach(function(c){ sizes.forEach(function(s){ var k=(c+'|'+s).toLowerCase(); var st=old[k]!=null?old[k]:(p.stock||0); h+='<tr><td>'+c+'</td><td>'+s+'</td><td><input class="num" type="number" id="var-'+pi+'-'+encodeURIComponent(c)+'-'+encodeURIComponent(s)+'" value="'+st+'"></td></tr>'; }); });
  h+='</table><div class="small">كل لون + مقاس ليه مخزون لوحده، عشان المتجر يخليك تختارهم، ومايقولش Variant not found</div>';

function uploadGallery(e,pi){ var files=e.target.files; if(!files.length) return; var prev=document.getElementById('gallery-preview-'+pi); Array.from(files).forEach(function(f){ var r=new FileReader(); r.onload=function(ev){ var ta=document.getElementById('e-gallery-'+pi); ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+ev.target.result; if(prev){ var im=document.createElement('img'); im.src=ev.target.result; im.style.cssText='width:70px;height:70px;object-fit:cover;border-radius:10px;border:1px solid #333'; prev.appendChild(im); } markDirty(); }; r.readAsDataURL(f); }); }
function collectVariants(pi){ var colors=getColors(pi); var sizes=getSizes(pi); if(!colors.length) colors=['Black']; if(!sizes.length) sizes=['One Size']; var out=[]; colors.forEach(function(c){ sizes.forEach(function(s){ var el=document.getElementById('var-'+pi+'-'+encodeURIComponent(c)+'-'+encodeURIComponent(s)); var st=el?parseInt(el.value||0):0; out.push({color:c,size:s,stock:st}); }); }); return out; }

async function saveAll(){

  // V11: sync product forms -> products (category, image, gallery, variants) before save
  try{
    products.forEach(function(p,pi){
      var catEl=document.getElementById('e-cat-'+pi); if(catEl){ var cv=catEl.value; if(cv==='__custom'){ var cc=document.getElementById('e-cat-custom-'+pi); if(cc && cc.value.trim()) p.category=cc.value.trim(); } else if(cv) p.category=cv; }
      var imgEl=document.getElementById('e-img-'+pi); if(imgEl && imgEl.value.trim()){ p.image=imgEl.value.trim(); p.img=p.image; }
      var gEl=document.getElementById('e-gallery-'+pi); if(gEl){ var gl=gEl.value.split('\n').map(function(s){return s.trim()}).filter(Boolean); p.gallery=gl; p.images=gl; }
      var cEl=document.getElementById('e-colors-'+pi); var sEl=document.getElementById('e-sizes-'+pi);
      if(cEl||sEl){ var vars=collectVariants(pi); if(vars.length){ p.variants=vars; p.colors=getColors(pi); p.sizes=getSizes(pi); var tot=0; vars.forEach(function(v){tot+=v.stock;}); p.stock=tot; } }
    });
  }catch(e){}

  var btn=document.querySelector('.savebar .btn'); btn.textContent='⏳ بحفظ...';
  // استنى 400ms عشان React / الداتا تخلص حفظ في localStorage
  await new Promise(function(res){ setTimeout(res, 400); });
  // اقرا الشحن من localStorage بالمفتاح الصح ayka_v2_shipping
  try{ var ls=JSON.parse(localStorage.getItem('ayka_v2_shipping')||'{}'); if(Object.keys(ls).length) shipping=Object.assign(shipping, ls); }catch(e){}
  // GET ثم PUT - اقرا الجديد من Firebase الاول وادمج تعديلاتك
  var r=await fetch(FB+'/products.json?ts='+Date.now()); var fresh=await r.json(); if(!Array.isArray(fresh)) fresh=Object.values(fresh||[]);
  var merged=fresh.map(function(fp){ var lp=products.find(function(x){return String(x.id)===String(fp.id)||x.name===fp.name;}); if(!lp) return fp; var o=Object.assign({},fp); o.name=lp.name; o.price=lp.price; o.discountPrice=lp.discountPrice; o.description=lp.description; o.category=lp.category; o.images=lp.images; o.variants=lp.variants; o.stock=lp.stock; return o; });
  products.forEach(function(lp){ if(!merged.find(function(x){return String(x.id)===String(lp.id)||x.name===lp.name;})) merged.push(lp); });
  var res1=await fetch(FB+'/products.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(merged)});
  var res2=await fetch(FB+'/shipping.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(shipping)});
  try{ await fetch(FB+'/settings.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(settings)}); }catch(e){}
  dirty=false; document.getElementById('saveStatus').textContent='✅ اتحفظ - منتجات '+res1.status+' - شحن '+res2.status; document.getElementById('saveStatus').style.color='#22c55e'; btn.textContent='✅ حفظ التغييرات';
  syncShippingToStorage();
  setTimeout(function(){ loadAll(); }, 800);
}
